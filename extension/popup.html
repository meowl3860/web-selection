<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Web Selection</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<main>
  <header>
    <img src="icons/32.png" alt="" width="20" height="20">
    <h1>Web Selection</h1>
  </header>

  <button type="button" id="start" class="primary" disabled>
    <span id="start-label">Start the brush</span>
    <span id="start-keys" class="start-keys"></span>
  </button>

  <section aria-labelledby="key-title">
    <h2 id="key-title">Trigger key</h2>
    <div class="key-row">
      <div id="keys" class="keys"></div>
      <button type="button" id="change" class="secondary">Change</button>
    </div>
    <p class="hint">Press it on any page to turn the brush on or off. Change opens the browser's shortcut settings.</p>
  </section>
</main>
<script src="popup.js"></script>
</body>
</html>
