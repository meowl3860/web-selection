<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="360" fill="#ffffff"/>
  <text x="320" y="32" text-anchor="middle" font-size="17" font-weight="600" fill="#1d2233">Average frame time per day (ms)</text>
