    <line x1="60" y1="300" x2="610" y2="300"/>
    <line x1="60" y1="240" x2="610" y2="240"/>
    <line x1="60" y1="180" x2="610" y2="180"/>
    <line x1="60" y1="120" x2="610" y2="120"/>
    <line x1="60" y1="60" x2="610" y2="60"/>
  </g>
  <g font-size="12" fill="#6b7186" text-anchor="end">
