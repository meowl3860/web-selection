    <rect x="467.5" y="183.75" width="50" height="116.25"/>
    <rect x="546" y="189" width="50" height="111"/>
  </g>
  <g font-size="13" font-weight="600" fill="#1d2233" text-anchor="middle">
    <text x="100" y="187">14.2</text><text x="178.5" y="175">15.8</text><text x="257" y="180">15.1</text>
    <text x="335.5" y="84">27.9</text><text x="414" y="171">16.4</text><text x="492.5" y="177">15.5</text><text x="571" y="183">14.8</text>
  </g>
  <g font-size="13" fill="#4a5068" text-anchor="middle">
    <text x="100" y="322">Mon</text><text x="178.5" y="322">Tue</text><text x="257" y="322">Wed</text><text x="335.5" y="322">Thu</text>
