<svg xmlns="http://www.w3.org/2000/svg" width="640" height="150" viewBox="0 0 640 150" font-family="Segoe UI, Arial, sans-serif">
  <rect width="640" height="150" fill="#f3f4f8"/>
  <rect x="0" y="0" width="640" height="40" fill="#2b3a67"/>
  <text x="20" y="26" font-size="15" font-weight="600" fill="#ffffff">Mail</text>
  <text x="620" y="26" font-size="13" fill="#c9d1ee" text-anchor="end">inbox · 3 unread</text>
  <rect x="12" y="52" width="616" height="46" rx="8" fill="#ffffff" stroke="#dde1ec"/>
  <g fill="none" stroke="#3a4157" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- reply -->
    <g transform="translate(40 75)"><path d="M-2 -7 L -9 0 L -2 7"/><path d="M-9 0 H 4 Q 11 0 11 8"/></g>
    <!-- archive: a box with a down arrow -->
    <g transform="translate(100 75)"><rect x="-10" y="-9" width="20" height="5" rx="1"/><path d="M-8 -4 V 9 H 8 V -4"/><path d="M0 -1 V 6 M -3 3 L 0 6 L 3 3"/></g>
    <!-- delete: a bin -->
    <g transform="translate(160 75)"><path d="M-9 -6 H 9"/><path d="M-3 -6 V -9 H 3 V -6"/><path d="M-7 -6 L -6 9 H 6 L 7 -6"/><path d="M-2 -2 V 6 M 2 -2 V 6"/></g>
    <!-- snooze: a clock -->
    <g transform="translate(220 75)"><circle r="9"/><path d="M0 -5 V 0 L 4 3"/></g>
    <!-- mark unread: an envelope -->
    <g transform="translate(280 75)"><rect x="-10" y="-7" width="20" height="14" rx="2"/><path d="M-10 -6 L 0 2 L 10 -6"/></g>
    <!-- label: a tag -->
    <g transform="translate(340 75)"><path d="M-9 -8 H 1 L 9 0 L 1 8 H -9 Z"/><circle cx="-4" cy="0" r="1.5"/></g>
  </g>
  <g fill="#3a4157"><circle cx="600" cy="75" r="2"/><circle cx="608" cy="75" r="2"/><circle cx="592" cy="75" r="2"/></g>
  <line x1="70" y1="62" x2="70" y2="88" stroke="#e3e6ef"/>
  <line x1="310" y1="62" x2="310" y2="88" stroke="#e3e6ef"/>
  <text x="20" y="128" font-size="13" fill="#3a4157">From: Lena Ortiz · Subject: Frame budget review on Friday</text>
</svg>
